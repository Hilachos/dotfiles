# ===== hyprlock · Tokyo Night Moon =====
general {
    hide_cursor = true
    ignore_empty_input = true
}

background {
    monitor =
    path = /home/hilachos/Pictures/wallpapers/fondo.jpg
    blur_passes = 3
    blur_size = 7
    brightness = 0.6
}

# Reloj grande
label {
    monitor =
    text = $TIME
    font_size = 90
    font_family = JetBrainsMono Nerd Font
    color = rgb(c8d3f5)
    position = 0, 200
    halign = center
    valign = center
}

# Fecha
label {
    monitor =
    text = cmd[update:60000] date +"%A, %d de %B"
    font_size = 20
    font_family = JetBrainsMono Nerd Font
    color = rgb(c099ff)
    position = 0, 100
    halign = center
    valign = center
}

# Campo de contraseña
input-field {
    monitor =
    size = 300, 50
    rounding = 12
    outline_thickness = 2
    outer_color = rgb(82aaff)
    inner_color = rgb(222436)
    font_color = rgb(c8d3f5)
    check_color = rgb(c3e88d)
    fail_color = rgb(ff757f)
    fade_on_empty = false
    placeholder_text = <i>Contraseña...</i>
    fail_text = <i>Incorrecta ($ATTEMPTS)</i>
    position = 0, -50
    halign = center
    valign = center
}
